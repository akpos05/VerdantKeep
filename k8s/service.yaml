# Exposes the game on port 30080 of the MicroK8s node.
apiVersion: v1
kind: Service
metadata:
  name: emberfall
  namespace: emberfall
  labels:
    app: emberfall
spec:
  type: NodePort
  selector:
    app: emberfall
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
